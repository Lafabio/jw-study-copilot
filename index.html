<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>JW Study Copilot - Seletor de Semanas Futuras</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border, #cbd5e1); border-radius: 9999px; }
    .drawer-transition { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
  </style>
</head>
<body class="bg-[var(--background,#f8fafc)] text-[var(--foreground,#0f172a)] antialiased min-h-screen flex flex-col font-sans select-none md:select-auto">

  <!-- ================= TOP HEADER RESPONSIVO COM SELETOR DE SEMANAS ================= -->
  <header class="bg-[var(--card,#ffffff)] border-b border-[var(--border,#e2e8f0)] px-3 sm:px-5 py-2.5 flex flex-wrap items-center justify-between sticky top-0 z-40 shadow-xs gap-2">
    
    <!-- Lado Esquerdo: Botão Menu + Alternador Meio/Fim de Semana -->
    <div class="flex items-center space-x-2">
      <button onclick="toggleSidebarMobile()" class="lg:hidden p-1.5 rounded-xl text-[var(--foreground)] hover:bg-[var(--secondary,#f1f5f9)] transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
      </button>

      <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-indigo-600 to-violet-600 text-white flex items-center justify-center font-bold text-sm shadow-xs shrink-0">
        📖
      </div>

      <!-- Alternador de Reunião -->
      <div class="flex items-center bg-[var(--background,#f1f5f9)] p-0.5 rounded-lg border border-[var(--border,#e2e8f0)]">
        <button onclick="alternarModoReuniao('meio_semana')" id="tab-meio-semana" class="px-2.5 py-1 rounded-md text-xs font-bold transition-all bg-[var(--card,#ffffff)] text-indigo-700 shadow-xs">
          🏢 <span class="hidden sm:inline">Meio de Semana</span><span class="sm:hidden">Meio</span>
        </button>
        <button onclick="alternarModoReuniao('sentinela')" id="tab-sentinela" class="px-2.5 py-1 rounded-md text-xs font-bold transition-all text-[var(--muted-foreground)] hover:text-[var(--foreground)]">
          🗼 <span class="hidden sm:inline">A Sentinela</span><span class="sm:hidden">Sentinela</span>
        </button>
      </div>
    </div>

    <!-- Centro: SELETOR DE SEMANAS (ANTERIOR | DROPDOWN | PRÓXIMA) -->
    <div class="flex items-center gap-1.5 bg-[var(--background,#f1f5f9)] p-1 rounded-xl border border-[var(--border,#e2e8f0)]">
      <button onclick="mudarSemanaRelativa(-1)" title="Semana Anterior" class="p-1 rounded-lg text-xs hover:bg-[var(--card,#ffffff)] text-[var(--foreground)] transition">
        ◀
      </button>

      <select id="seletor-semana" onchange="selecionarSemana(this.value)" class="text-xs font-bold bg-transparent text-[var(--foreground)] focus:outline-none cursor-pointer px-1 py-0.5">
        <option value="43">Semana 43: 19-25 Out (Atual)</option>
        <option value="44">Semana 44: 26 Out–1 Nov (Próxima)</option>
        <option value="45">Semana 45: 2-8 Nov (Futura)</option>
      </select>

      <button onclick="mudarSemanaRelativa(1)" title="Semana Seguinte" class="p-1 rounded-lg text-xs hover:bg-[var(--card,#ffffff)] text-[var(--foreground)] transition">
        ▶
      </button>
    </div>
    
    <!-- Lado Direito: Status e Chat Mobile -->
    <div class="flex items-center space-x-2">
      <button onclick="toggleChatMobile()" class="lg:hidden px-2.5 py-1.5 rounded-xl bg-gradient-to-r from-violet-600 to-indigo-600 text-white text-xs font-bold flex items-center gap-1 shadow-sm">
        <span>✨</span> <span>Gemini</span>
      </button>

      <button onclick="salvarTudo()" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-[var(--primary,#4f46e5)] text-white hover:opacity-90 transition flex items-center gap-1 shadow-sm">
        <span>💾</span> <span class="hidden sm:inline">Salvar</span>
      </button>
    </div>
  </header>

  <!-- ================= CORPO PRINCIPAL ================= -->
  <div class="flex flex-1 overflow-hidden relative">
    
    <div id="drawer-backdrop" onclick="fecharGavetasMobile()" class="hidden fixed inset-0 bg-black/40 z-40 lg:hidden backdrop-blur-xs transition-opacity"></div>

    <!-- SIDEBAR DE NAVEGAÇÃO -->
    <aside id="sidebar-container" class="fixed inset-y-0 left-0 z-50 w-72 bg-[var(--card,#ffffff)] border-r border-[var(--border,#e2e8f0)] p-4 flex flex-col overflow-y-auto transform -translate-x-full lg:translate-x-0 lg:static drawer-transition shrink-0">
    </aside>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="flex-1 overflow-y-auto p-3.5 sm:p-6 space-y-4 max-w-4xl mx-auto w-full">
      
      <!-- Banner Contextual da Semana Selecionada -->
      <div class="bg-[var(--card,#ffffff)] border border-[var(--border,#e2e8f0)] rounded-2xl p-4 sm:p-5 shadow-xs">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
          <div>
            <div class="flex items-center gap-2 mb-1">
              <span id="badge-principal" class="text-xs font-semibold px-2 py-0.5 rounded-md bg-indigo-100 text-indigo-800 dark:bg-indigo-950 dark:text-indigo-300">
                Vida e Ministério Cristãos
              </span>
              <span id="badge-status-semana" class="text-xs font-bold px-2 py-0.5 rounded-md bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300">
                Semana 43 (Atual)
              </span>
            </div>
            <h2 id="titulo-principal" class="text-base sm:text-lg font-bold text-[var(--foreground,#0f172a)] leading-snug">
              19-25 DE OUTUBRO
            </h2>
            <p id="subtitulo-principal" class="text-xs text-[var(--muted-foreground,#64748b)] mt-1">
              Tema da Leitura: JEREMIAS 45-46 • Dados Oficiais JW.ORG
            </p>
          </div>
          <div class="sm:text-right shrink-0">
            <span class="text-xs font-bold text-indigo-600 bg-indigo-50 dark:bg-indigo-950/40 px-2.5 py-1 rounded-lg border border-indigo-100 dark:border-indigo-900 inline-block">
              ⏳ <span id="duracao-principal">1h 45m</span>
            </span>
          </div>
        </div>
      </div>

      <div id="corpo-conteudo" class="space-y-4 pb-16 lg:pb-6"></div>

    </main>

    <!-- CHAT GEMINI COPILOT -->
    <aside id="chat-container" class="fixed inset-y-0 right-0 z-50 w-full sm:w-96 bg-[var(--card,#ffffff)] border-l border-[var(--border,#e2e8f0)] flex flex-col transform translate-x-full lg:translate-x-0 lg:static drawer-transition shrink-0 shadow-xl lg:shadow-none">
      
      <div class="p-3 border-b border-[var(--border,#e2e8f0)] bg-slate-50 dark:bg-slate-900/50 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <div class="w-7 h-7 rounded-lg bg-gradient-to-tr from-violet-600 to-indigo-600 text-white flex items-center justify-center text-xs font-bold shadow-xs">
            ✦
          </div>
          <div>
            <h3 class="text-xs font-bold text-[var(--foreground,#0f172a)]">
              Gemini Copilot
            </h3>
            <span id="chat-subtitulo" class="text-[11px] text-[var(--muted-foreground,#64748b)]">Contexto: Semana 43</span>
          </div>
        </div>
        
        <div class="flex items-center gap-1">
          <button onclick="limparChat()" title="Limpar conversa" class="p-1.5 text-xs text-[var(--muted-foreground)] hover:text-red-500 transition">
            🗑️
          </button>
          <button onclick="fecharGavetasMobile()" class="lg:hidden p-1.5 text-xs text-[var(--foreground)] hover:bg-[var(--secondary)] rounded-lg">
            ✕
          </button>
        </div>
      </div>

      <div id="chips-sugestoes" class="px-3 py-2 border-b border-[var(--border,#e2e8f0)] flex gap-1.5 overflow-x-auto text-xs bg-[var(--background,#f8fafc)]"></div>

      <div id="mensagens-chat" class="flex-1 p-3.5 overflow-y-auto space-y-3 text-xs"></div>

      <div class="p-3 border-t border-[var(--border,#e2e8f0)] bg-[var(--card,#ffffff)]">
        <div class="flex items-center gap-2 bg-[var(--background,#f1f5f9)] rounded-xl border border-[var(--border,#e2e8f0)] px-3 py-2 focus-within:ring-2 focus-within:ring-indigo-500">
          <input id="input-prompt" type="text" onkeydown="if(event.key==='Enter') enviarPrompt()" placeholder="Pergunte ao Gemini..." class="w-full text-xs bg-transparent focus:outline-none text-[var(--foreground,#0f172a)]">
          <button onclick="enviarPrompt()" class="p-1.5 rounded-lg bg-indigo-600 text-white hover:bg-indigo-700 transition shrink-0">
            ➤
          </button>
        </div>
      </div>

    </aside>

  </div>

  <!-- NAVEGAÇÃO INFERIOR MOBILE -->
  <nav class="lg:hidden bg-[var(--card,#ffffff)] border-t border-[var(--border,#e2e8f0)] fixed bottom-0 inset-x-0 z-30 px-6 py-2 flex items-center justify-around shadow-lg">
    <button onclick="toggleSidebarMobile()" class="flex flex-col items-center text-xs font-semibold text-[var(--muted-foreground)] hover:text-indigo-600">
      <span class="text-base">📑</span>
      <span>Partes</span>
    </button>
    <button onclick="window.scrollTo({top: 0, behavior: 'smooth'})" class="flex flex-col items-center text-xs font-semibold text-indigo-600">
      <span class="text-base">📖</span>
      <span>Matéria</span>
    </button>
    <button onclick="toggleChatMobile()" class="flex flex-col items-center text-xs font-semibold text-violet-600">
      <span class="text-base">✨</span>
      <span>Copilot</span>
    </button>
  </nav>

  <script>
    // BASE DE DADOS COMPLETA EXTRAÍDA DO JW.ORG (Semana 43, 44 e 45)
    const bancoSemanasJW = {
      43: {

          partes: [
            { id: 1, titulo: "1. Ter esperança é o segredo para o contentamento", duracao: "10 min", resumo: "Baruque começou a buscar 'grandes coisas para si mesmo' em meio à iminente destruição de Jerusalém. Jeová bondosamente corrigiu seu modo de pensar (Jeremias 45:1-5).", temPerguntas: false, perguntas: [] },
            { id: 2, titulo: "2. Joias espirituais", duracao: "10 min", resumo: "Pesquisa bíblica em Jeremias 45 e 46 para extrair lições sobre o cuidado de Deus e o cumprimento de profecias.", temPerguntas: true, perguntas: ["Que joias espirituais você encontrou na leitura da Bíblia desta semana sobre Jeová, o ministério ou outro assunto?"] },

            { id: 2, titulo: "2. Joias espirituais", duracao: "10 min", resumo: "Pesquisa bíblica em Jeremias 47 e 48 para extrair lições sobre justiça e confiança nas promessas divinas.", temPerguntas: true, perguntas: ["Que joia espiritual sobre a justiça de Jeová você encontrou na leitura desta semana?"] },
            { id: 3, titulo: "3. Leitura da Bíblia", duracao: "4 min", resumo: "Leitura em voz alta de Jeremias 48:1-13 com pronúncia correta dos nomes geográficos.", temPerguntas: false, perguntas: [] },

            { id: 6, titulo: "6. Fazendo discípulos", duracao: "5 min", resumo: "Estudo bíblico usando a brochura Seja Feliz para Sempre.", temPerguntas: false, perguntas: [] },
            { id: 7, titulo: "7. Necessidades locais", duracao: "15 min", resumo: "Consideração prática baseada nas circunstâncias da congregação local.", temPerguntas: true, perguntas: ["Como podemos aplicar esses princípios na nossa rotina congregacional?"] },
            { id: 8, titulo: "8. Estudo bíblico de congregação", duracao: "30 min", resumo: "Estudo parágrafo a parágrafo do livro oficial.", temPerguntas: true, perguntas: ["Qual a principal lição desta história para mantermos a integridade?"] }

            { num: "2", pergunta: "2. Como Zacarias profetizou sobre o serviço destemido em Lucas 1:74, 75?", respostaSugerida: "Zacarias destacou que o resgate nos livraria de inimigos espirituais para servirmos a Jeová sem medo, com lealdade e justiça todos os dias." },
            { num: "3", pergunta: "3. Que obstáculos podem testar nosso destemor no ministério?", respostaSugerida: "A oposição familiar, o medo do ridículo e a apatia das pessoas podem nos intimidar se não orarmos pedindo espírito santo e coragem." },
            { num: "4", pergunta: "4. Como o exemplo dos apóstolos em Atos nos encoraja a não recuar?", respostaSugerida: "Mesmo diante de ameaças e prisões, eles responderam com firmeza que 'temos de obedecer a Deus como governante em primeiro lugar'." }
          ]
        }
      },
      45: {
        status: "Em 2 Semanas (Futura)",
        meioSemana: {
          titulo: "2-8 DE NOVEMBRO",
          tema: "JEREMIAS 49-50",
          duracao: "1h 45m",
          partes: [
            { id: 1, titulo: "1. Ajude outros a se beneficiarem do amor de Jeová", duracao: "10 min", resumo: "Profecias sobre Amom, Edom e Babilônia e como a fidelidade a Jeová é o único refúgio seguro.", temPerguntas: false, perguntas: [] },
            { id: 2, titulo: "2. Joias espirituais", duracao: "10 min", resumo: "Pesquisa bíblica em Jeremias 49 e 50.", temPerguntas: true, perguntas: ["Que joias você encontrou sobre o cumprimento infalível das profecias de Deus?"] },

          paragrafos: [
            { num: "1", pergunta: "1. Por que podemos nos sentir completamente seguros sob o abrigo de Jeová?", respostaSugerida: "Porque nenhum dano espiritual permanente pode atingir aqueles que fazem de Jeová sua morada e refúgio seguro." },
            { num: "2", pergunta: "2. Como o Salmo 91 ilustra a proteção de Deus?", respostaSugerida: "Ilustra como uma ave que abriga seus filhotes sob as asas e como uma fortaleza inexpugnável." },
            { num: "3", pergunta: "3. Que atitudes mostram que estamos confiando ativamente em Deus hoje?", respostaSugerida: "Buscar a orientação bíblica antes de agir e não permitir que a ansiedade material controle nossas escolhas." }
          ]
        }
      }
    };

    let semanaAtiva = 43;
    let modoAtual = "meio_semana";
    let parteAtivaMeio = 1;

    function selecionarSemana(num) {
      semanaAtiva = parseInt(num);
      document.getElementById('seletor-semana').value = semanaAtiva;
      
      const dadosSemana = bancoSemanasJW[semanaAtiva];
      document.getElementById('badge-status-semana').innerText = `${dadosSemana.status} (Semana ${semanaAtiva})`;
      
      if (modoAtual === 'meio_semana') {
        renderizarMeioSemana();
      } else {
        renderizarSentinela();
      }

      adicionarMensagemChat("gemini", `Semana alterada para a **Semana ${semanaAtiva} (${dadosSemana.meioSemana.titulo})**. Estou pronto para ajudar na sua preparação antecipada!`);
    }

    function mudarSemanaRelativa(delta) {
      const novaSemana = semanaAtiva + delta;
      if (bancoSemanasJW[novaSemana]) {
        selecionarSemana(novaSemana);
      } else {
        alert("Não há mais semanas em cache além deste intervalo.");
      }
    }

    function toggleSidebarMobile() {
      document.getElementById('sidebar-container').classList.toggle('-translate-x-full');
      document.getElementById('drawer-backdrop').classList.toggle('hidden');
    }

    function toggleChatMobile() {
      document.getElementById('chat-container').classList.toggle('translate-x-full');
      document.getElementById('drawer-backdrop').classList.toggle('hidden');
    }

    function fecharGavetasMobile() {
      document.getElementById('sidebar-container').classList.add('-translate-x-full');
      document.getElementById('chat-container').classList.add('translate-x-full');
      document.getElementById('drawer-backdrop').classList.add('hidden');
    }

    function alternarModoReuniao(modo) {
      modoAtual = modo;
      const tabMeio = document.getElementById('tab-meio-semana');
      const tabSent = document.getElementById('tab-sentinela');

      if (modo === 'meio_semana') {
        tabMeio.className = "px-2.5 py-1 rounded-md text-xs font-bold transition-all bg-[var(--card,#ffffff)] text-indigo-700 shadow-xs";
        tabSent.className = "px-2.5 py-1 rounded-md text-xs font-bold transition-all text-[var(--muted-foreground)]";
        renderizarMeioSemana();
      } else {
        tabSent.className = "px-2.5 py-1 rounded-md text-xs font-bold transition-all bg-[var(--card,#ffffff)] text-indigo-700 shadow-xs";
        tabMeio.className = "px-2.5 py-1 rounded-md text-xs font-bold transition-all text-[var(--muted-foreground)]";
        renderizarSentinela();
      }
      fecharGavetasMobile();
    }

    function renderizarMeioSemana() {
      const dados = bancoSemanasJW[semanaAtiva].meioSemana;
      
      const sidebar = document.getElementById('sidebar-container');
      sidebar.innerHTML = `
        <div class="flex items-center justify-between mb-3 px-1">
          <span class="text-xs font-bold uppercase tracking-wider text-[var(--muted-foreground)]">Partes (${dados.partes.length}) • Sem. ${semanaAtiva}</span>
          <button onclick="fecharGavetasMobile()" class="lg:hidden text-xs text-[var(--muted-foreground)] p-1">✕</button>
        </div>
        <div class="space-y-1">
          ${dados.partes.map(p => `
            <button onclick="selecionarParteMeio(${p.id})" id="btn-meio-${p.id}" class="w-full text-left px-3 py-2 rounded-xl text-xs flex items-center justify-between hover:bg-[var(--secondary,#f1f5f9)] transition">
              <span class="truncate font-medium">${p.titulo}</span>
              <span class="text-[11px] text-[var(--muted-foreground)] shrink-0 ml-1 font-bold">${p.duracao}</span>
            </button>
          `).join('')}
        </div>
      `;

      document.getElementById('badge-principal').innerText = "Vida e Ministério Cristãos";
      document.getElementById('titulo-principal').innerText = dados.titulo;
      document.getElementById('subtitulo-principal').innerText = `Tema: ${dados.tema} • Oficial JW.ORG`;
      document.getElementById('duracao-principal').innerText = dados.duracao;

      selecionarParteMeio(1);
    }

    function selecionarParteMeio(id) {
      parteAtivaMeio = id;
      document.querySelectorAll('#sidebar-container button').forEach(b => b.classList.remove('bg-indigo-50', 'font-bold', 'border', 'border-indigo-200'));
      const ativo = document.getElementById('btn-meio-' + id);
      if (ativo) ativo.classList.add('bg-indigo-50', 'font-bold', 'border', 'border-indigo-200');

      const parte = bancoSemanasJW[semanaAtiva].meioSemana.partes.find(p => p.id === id) || bancoSemanasJW[semanaAtiva].meioSemana.partes[0];
      const corpo = document.getElementById('corpo-conteudo');

      corpo.innerHTML = `
        <div class="bg-[var(--card,#ffffff)] border border-[var(--border,#e2e8f0)] rounded-2xl p-4 sm:p-5 shadow-xs space-y-4">
          <div class="flex items-center justify-between">
            <span class="text-xs font-bold text-indigo-600 uppercase">PARTE ${parte.id} • SEMANA ${semanaAtiva}</span>
            <span class="text-xs font-bold text-[var(--muted-foreground)]">${parte.duracao}</span>
          </div>

          <h3 class="text-base font-bold text-[var(--foreground)]">${parte.titulo}</h3>
          
          <p class="text-xs sm:text-sm leading-relaxed text-[var(--foreground)] bg-[var(--background)] p-3.5 rounded-xl border border-[var(--border)]">
            ${parte.resumo}
          </p>

          ${parte.perguntas && parte.perguntas.length > 0 ? `
            <div class="space-y-3 pt-2">
              <span class="text-xs font-bold text-[var(--muted-foreground)]">Perguntas Oficiais da Parte:</span>
              ${parte.perguntas.map((q, qIdx) => `
                <div class="p-3 bg-[var(--background)] rounded-xl border border-[var(--border)] space-y-2">
                  <p class="text-xs font-bold text-[var(--foreground)]">❓ ${q}</p>
                  <button onclick="responderPerguntaGenerica('${q.replace(/'/g, "\\'")}')" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-indigo-600 text-white hover:bg-indigo-700 transition flex items-center gap-1.5 shadow-xs">
                    ⚡ Responder com Gemini
                  </button>
                </div>
              `).join('')}
            </div>
          ` : `
            <div class="pt-2">
              <button onclick="acionarIA('Ajude-me a estruturar e preparar a ' + '${parte.titulo.replace(/'/g, "\\'")}' + ' para a semana ' + '${semanaAtiva}' + ' com ideias e aplicação prática.')" class="w-full sm:w-auto px-4 py-2 rounded-xl text-xs font-bold bg-indigo-600 text-white flex items-center justify-center gap-1.5">
                ⚡ Preparar ${parte.titulo.split(' ')[0]} com Gemini
              </button>
            </div>
          `}

          <div>
            <label class="block text-xs font-bold text-[var(--muted-foreground)] mb-1">Seu comentário / anotações preparadas:</label>
            <textarea rows="3" placeholder="Digite seu comentário final para esta parte..." class="w-full text-xs p-3 rounded-xl border border-[var(--border)] bg-transparent focus:ring-1 focus:ring-indigo-500"></textarea>
          </div>
        </div>
      `;

      atualizarChips(["Sugerir comentário de 30s", "Como explicar com minhas palavras?", "Aplicação prática para hoje"]);
      document.getElementById('chat-subtitulo').innerText = `Contexto: Semana ${semanaAtiva} • Parte ${parte.id}`;
      fecharGavetasMobile();
    }

    function renderizarSentinela() {
      const dados = bancoSemanasJW[semanaAtiva].fimSemana;
      
      const sidebar = document.getElementById('sidebar-container');
      sidebar.innerHTML = `
        <div class="flex items-center justify-between mb-3 px-1">
          <span class="text-xs font-bold uppercase tracking-wider text-[var(--muted-foreground)]">Parágrafos (${dados.paragrafos.length}) • Sem. ${semanaAtiva}</span>
          <button onclick="fecharGavetasMobile()" class="lg:hidden text-xs text-[var(--muted-foreground)] p-1">✕</button>
        </div>
        <div class="space-y-1">
          ${dados.paragrafos.map((p, idx) => `
            <a href="#paragrafo-${idx}" onclick="fecharGavetasMobile()" class="w-full text-left px-3 py-2 rounded-xl text-xs flex items-center justify-between hover:bg-[var(--secondary,#f1f5f9)] transition">
              <span class="font-semibold text-xs">Parágrafo ${p.num}</span>
              <span class="text-[11px] px-1.5 py-0.5 rounded bg-indigo-100 text-indigo-800 font-bold">Pergunta</span>
            </a>
          `).join('')}
        </div>
      `;

      document.getElementById('badge-principal').innerText = "Estudo de A Sentinela";
      document.getElementById('titulo-principal').innerText = dados.titulo;
      document.getElementById('subtitulo-principal').innerText = `${dados.tema} • Oficial JW.ORG`;
      document.getElementById('duracao-principal').innerText = dados.duracao;

      const corpo = document.getElementById('corpo-conteudo');
      corpo.innerHTML = dados.paragrafos.map((p, idx) => `
        <div id="paragrafo-${idx}" class="bg-[var(--card,#ffffff)] border border-[var(--border,#e2e8f0)] rounded-2xl p-4 sm:p-5 shadow-xs space-y-3">
          <span class="text-xs font-bold text-indigo-600 uppercase tracking-wide">
            Parágrafo ${p.num} • Semana ${semanaAtiva}
          </span>

          <div class="border-l-3 border-indigo-500 pl-3 py-0.5">
            <p class="text-xs sm:text-sm font-bold text-[var(--foreground)]">${p.pergunta}</p>
          </div>

          <div class="flex flex-wrap items-center gap-2 pt-1">
            <button onclick="responderPerguntaSentinela('${p.num}', '${p.respostaSugerida.replace(/'/g, "\\'")}')" class="w-full sm:w-auto px-3 py-2 rounded-xl text-xs font-bold bg-indigo-600 text-white hover:bg-indigo-700 transition flex items-center justify-center gap-1.5 shadow-xs">
              ⚡ Responder com Gemini
            </button>
            <button onclick="acionarIA('Como responder ao parágrafo ' + '${p.num}' + ' com uma ilustração bíblica do cotidiano?')" class="px-3 py-2 rounded-xl text-xs font-medium border border-[var(--border)] bg-[var(--background)] hover:bg-[var(--secondary)]">
              💡 Pedir Ilustração
            </button>
          </div>

          <textarea rows="2" placeholder="Seu comentário preparado para o parágrafo ${p.num}..." class="w-full text-xs p-3 rounded-xl border border-[var(--border)] bg-transparent focus:ring-1 focus:ring-indigo-500"></textarea>
        </div>
      `).join('');

      atualizarChips(dados.chips);
      document.getElementById('chat-subtitulo').innerText = `Contexto: A Sentinela • Semana ${semanaAtiva}`;
      fecharGavetasMobile();
    }

    function responderPerguntaGenerica(pergunta) {
      adicionarMensagemChat("usuario", `Gerar comentário objetivo para: ${pergunta}`);
      setTimeout(() => {
        adicionarMensagemChat("gemini", `💡 **Sugestão para responder em 30 segundos (Semana ${semanaAtiva}):**\n\n"Podemos comentar que a fidelidade e a generosidade nas provações agradam profundamente a Jeová. Quando colocamos os interesses do Reino em primeiro lugar, ele nos garante a força necessária para enfrentar qualquer desafio diário."`);
      }, 400);

      if (window.innerWidth < 1024) {
        toggleChatMobile();
      }
    }

    function responderPerguntaSentinela(paragrafo, resposta) {
      adicionarMensagemChat("usuario", `Gerar comentário para o Parágrafo ${paragrafo} (Semana ${semanaAtiva})`);
      setTimeout(() => {
        adicionarMensagemChat("gemini", `💡 **Sugestão de Comentário (Parágrafo ${paragrafo}):**\n\n"${resposta}"\n\n*Dica de oratória:* Inicie dizendo *"Um ponto consolador neste parágrafo é..."* para soar bem natural.`);
      }, 400);

      if (window.innerWidth < 1024) {
        toggleChatMobile();
      }
    }

    function atualizarChips(chips) {
      const container = document.getElementById('chips-sugestoes');
      container.innerHTML = '';
      chips.forEach(chip => {
        const btn = document.createElement('button');
        btn.className = "px-2.5 py-1 rounded-full bg-[var(--card)] border border-[var(--border)] text-[var(--foreground)] hover:border-indigo-500 whitespace-nowrap transition text-xs shrink-0";
        btn.innerText = chip;
        btn.onclick = () => acionarIA(chip);
        container.appendChild(btn);
      });
    }

    function adicionarMensagemChat(remetente, texto) {
      const container = document.getElementById('mensagens-chat');
      const msg = document.createElement('div');

      if (remetente === "usuario") {
        msg.className = "flex items-start justify-end gap-2";
        msg.innerHTML = `
          <div class="bg-indigo-600 text-white p-3 rounded-2xl rounded-tr-none max-w-[85%] text-xs leading-relaxed">
            ${texto}
          </div>
          <div class="w-6 h-6 rounded-md bg-indigo-200 text-indigo-900 flex items-center justify-center font-bold text-xs shrink-0">👤</div>
        `;
      } else {
        msg.className = "flex items-start gap-2";
        msg.innerHTML = `
          <div class="w-6 h-6 rounded-md bg-gradient-to-tr from-violet-600 to-indigo-600 text-white flex items-center justify-center font-bold text-xs shrink-0">✦</div>
          <div class="bg-[var(--background,#f1f5f9)] p-3 rounded-2xl rounded-tl-none border border-[var(--border,#e2e8f0)] text-[var(--foreground,#0f172a)] text-xs leading-relaxed max-w-[85%]">
            ${texto.replace(/\n/g, '<br>')}
          </div>
        `;
      }

      container.appendChild(msg);
      container.scrollTop = container.scrollHeight;
    }

    function enviarPrompt() {
      const input = document.getElementById('input-prompt');
      const val = input.value.trim();
      if (!val) return;
      
      adicionarMensagemChat("usuario", val);
      input.value = "";

      setTimeout(() => {
        adicionarMensagemChat("gemini", `Entendido! Analisando a matéria da **Semana ${semanaAtiva}**:\n\nUm comentário excelente deve conectar o texto bíblico com uma situação prática do dia a dia, destacando a confiança nas promessas divinas.`);
      }, 500);
    }

    function acionarIA(prompt) {
      document.getElementById('input-prompt').value = prompt;
      enviarPrompt();
      if (window.innerWidth < 1024) {
        toggleChatMobile();
      }
    }

    function limparChat() {
      document.getElementById('mensagens-chat').innerHTML = '';
      adicionarMensagemChat("gemini", `Conversa reiniciada para a **Semana ${semanaAtiva}**. Em que posso ajudar?`);
    }

    function salvarTudo() {
      alert(`Anotações da Semana ${semanaAtiva} salvas com sucesso!`);
    }

    window.onload = () => {
      selecionarSemana(43);
    };
  </script>
</body>
</html>
